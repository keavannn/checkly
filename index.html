<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  📝  TOUS LES TEXTES DU JEU SONT ICI                                ║
   ║                                                                    ║
   ║  Tu peux modifier tout ce qui est entre guillemets "…".            ║
   ║  Règles simples :                                                  ║
   ║   • garde les guillemets "…" et la virgule à la fin de la ligne ;  ║
   ║   • si ton texte contient un guillemet ", écris \" à la place ;    ║
   ║   • ces mots-clés sont remplacés automatiquement :                 ║
   ║       {elle}  → son prénom          {lui}   → ton prénom           ║
   ║       {surnom}→ son surnom          {ville} → la ville             ║
   ║       {debut} → « mercredi 30 décembre » {fin} → « mardi 5 janvier »║
   ║       {nbJours} → 7                 {numero} → n° de l'affaire     ║
   ║  Après une modif, enregistre et recharge la page pour vérifier.    ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const CONFIG = {

  /* ───────── 1. VOUS DEUX ───────── */
  elle: "Iman",
  lui: "Keavan",
  surnom: "Petit Singe",

  /* ───────── 2. LE VOYAGE ───────── */
  ville: "ROTTERDAM",            // en MAJUSCULES : c'est le mot qu'elle déchiffre à l'étape 5
  depart: "2026-12-30T08:00",    // date + heure du départ (AAAA-MM-JJTHH:MM) → compte à rebours
  retour: "2027-01-05",          // dernier jour du voyage (AAAA-MM-JJ)
  numero: "3012",                // numéro de « l'affaire » (ici : 30/12, la date de départ)

  transport: {
    mode: "train",               // "train" ou "avion" → change l'animation de l'écran final
    titre: "Le transport",
    texte: "Rien n'est encore réservé : c'est une proposition. Tu dis oui, je m'occupe de tout. Toi, tu prends juste ta valise (et ton bonnet)."
  },
  hebergement: {
    titre: "Le QG",
    texte: "Pas encore choisi. On le choisit ensemble… ou je te fais la surprise 🤫"
  },

  /* ───────── 3. VOS PHOTOS (dossier « photos ») ─────────
     Dépose simplement un fichier avec CE nom dans le dossier photos/.
     S'il n'y est pas, le jeu affiche une illustration à la place : rien ne casse. */
  photos: {
    suspects: "photos/suspects.jpg",   // écran d'accueil : la « photo des suspects » (vous deux)
    nous: "photos/nous.jpg",           // écran final, à côté de la lettre
    puzzle: "photos/puzzle.jpg"        // étape 4 : remplace le dessin du puzzle (photo carrée idéalement)
  },

  son: true,                     // true = sons activés au départ (jamais avant qu'elle touche l'écran)

  /* Bouton « répondre » de la fin : ouvre WhatsApp avec un message pré-écrit.
     Mets ton numéro au format international sans + ni espaces (ex : "33612345678"),
     ou laisse "" et WhatsApp lui demandera à qui l'envoyer. */
  reponse: {
    bouton: "Répondre à {lui}",
    message: "Affaire résolue 🕵️‍♀️ Direction {ville} pour le Nouvel An ! J'ai trop hâte 🎆",
    whatsapp: ""
  },

  /* ───────── 4. ÉCRAN D'ACCUEIL ───────── */

    dossier: "Dossier n°{numero}",

    titre: "La Grande Disparition",
    question: "Où {lui} et {elle} disparaissent-ils pour le Nouvel An ?",
    agent: "Enquêtrice assignée : {elle}, alias « {surnom} »",

  /* Le briefing tapé à la machine (une ligne = un paragraphe) */

    titre: "Rapport de police",
    lignes: [
      "Fin décembre, deux individus vont disparaître pendant plusieurs jours.",
      "Le premier : {lui}. Charmant, organisé, très suspect.",
      "La seconde : une certaine {elle}… Ça ne te dit rien ?",

  /* ───────── 5. LES 5 ÉTAPES ───────── */

      "☕": "Le café de {lui}. Ne touche pas, c'est sacré.",
      "🍌": "Une banane. Pour toi ? Sans doute. Mais pas un indice.",
      "🧸": "Un nounours. Témoin clé. Il refuse de parler sans son avocat.",
      "🕶️": "Des lunettes de soleil. Optimiste, le suspect.",
      "👟": "Une basket. Elle sent l'aventure (et un peu le pied).",
      "🔑": "Une clé. De quoi ? Mystère. On verra plus tard.",

    },
    bravo: "5 sur 5 ! Le suspect a laissé des traces partout.",
    revelation: {
      titre: "Indice n°1 : la date",

  /* ÉTAPE 2 : l'interrogatoire (quiz)
     ok: true = bonne réponse. Toutes les réponses font avancer : les « fausses » ont juste une réaction drôle. */
  quiz: {
    titre: "L'interrogatoire",
    consigne: "Le témoin ne répond qu'en QCM. Il n'y a pas vraiment de mauvaise réponse.",
    intro: "J'ai coincé un témoin. Pose-lui les questions, je prends des notes.",
    suivant: "Question suivante",
    questions: [
      { q: "Quel est le nom de code de l'enquêtrice ?",
        reponses: [
          { t: "Agent 007",             r: "Trop sérieux. 007 ne pique pas les frites des autres." },
          { t: "{surnom}",              r: "Confirmé. Le singe le plus mignon du royaume.", ok: true },
          { t: "Inspecteur Gadget",     r: "Lui a des bras extensibles. Toi, des câlins extensibles. Nuance." },
          { t: "Madame la Commissaire", r: "Bientôt peut-être. Pour l'instant : {surnom}." }
        ] },
      { q: "D'après nos sources, qu'est-ce que {lui} préfère chez toi ?",
        reponses: [
          { t: "Ton sourire",                     r: "Incomplet. Le sourire, oui… mais pas que." },
          { t: "Ton rire",                        r: "Trop restrictif, inspectrice. Le témoin s'indigne." },
          { t: "Ta façon de voler la couverture", r: "Ça, il le supporte. Nuance. (Il a froid.)" },
          { t: "Tout",                            r: "TOUT. Le témoin n'a même pas hésité.", ok: true }
        ] },
      { q: "Le suspect a cherché « pays avec plus de vélos que d'habitants ». Lequel ?",
        reponses: [
          { t: "La Suisse",    r: "Là-bas, c'est montres et chocolat. Pas assez de vélos." },
          { t: "La Belgique",  r: "Tu brûles ! Monte juste un peu plus au nord." },
          { t: "Les Pays-Bas", r: "Exact ! Plus de 20 millions de vélos pour 18 millions d'habitants.", ok: true },
          { t: "Le Groenland", r: "Le vélo sur la banquise, ce sera pour un autre voyage." }
        ] },
      { q: "Dans la valise du suspect, ça sentait…",
        reponses: [
          { t: "La gaufre au caramel", r: "Stroopwafel détecté. Ton flair est infaillible.", ok: true },
          { t: "Le fromage",           r: "Du gouda ? Non, ça c'était les chaussettes de {lui}." },
          { t: "La crème solaire",     r: "On ne part pas aux Bahamas, désolé. Fin décembre, c'est bonnet et écharpe." },
          { t: "La tulipe",            r: "Une tulipe, ça ne sent presque rien. Ton flair a pris froid." }
        ] },
      { q: "Dernière question : es-tu prête à disparaître {nbJours} jours avec moi ?",
        reponses: [
          { t: "Oui",      r: "Noté. Signé. Tamponné.", ok: true },
          { t: "Oui !!!",  r: "Ton enthousiasme a été versé au dossier.", ok: true },
          { t: "Non",      fuyant: true }   // ce bouton s'enfuit quand elle essaie de le toucher 😏
        ] }
    ],
    // Ce que dit le singe quand elle essaie d'attraper le bouton « Non »
    fuyant: ["Raté 😏", "Il est rapide, hein ?", "Ce bouton est très timide.", "Bon, je crois qu'il veut dire oui."],
    fuyantFinal: "Bon d'accord, oui",
    revelation: {
      titre: "Indice n°2 : le pays",
      texte: "Les témoins sont formels : direction les Pays-Bas ! Et non, pas Amsterdam. Trop facile pour toi."
    }
  },

  /* ÉTAPE 3 : le mémory
     Chaque paire = une activité. Mets une photo (ex : "photos/memory-1.jpg") pour remplacer l'emoji. */
  memory: {
    titre: "Les pièces à conviction",
    consigne: "Retourne les cartes deux par deux. Chaque paire révèle une activité du programme.",
    intro: "Le suspect a semé des preuves partout. Trouve les paires.",
    rate: ["Presque !", "Pas ces deux-là…", "Ta mémoire chauffe, ça se sent.", "On y est presque, inspectrice."],
    paires: [
      { emoji: "🥞", photo: "photos/memory-1.jpg", legende: "Une croisière où les crêpes sont à volonté. Oui, ça existe." },
      { emoji: "🧊", photo: "photos/memory-2.jpg", legende: "Des maisons en forme de cubes, penchées à 45°. On va vérifier qu'elles tiennent." },
      { emoji: "🦢", photo: "photos/memory-3.jpg", legende: "Un pont surnommé « le Cygne », à traverser au coucher du soleil." },
      { emoji: "🧀", photo: "photos/memory-4.jpg", legende: "Un marché couvert au plafond peint géant. On goûte tout, on ne regrette rien." },
      { emoji: "🚲", photo: "photos/memory-5.jpg", legende: "Une balade à vélo au milieu de 19 moulins du XVIIIe siècle." },
      { emoji: "🐒", photo: "photos/memory-6.jpg", legende: "Une visite à ta famille. (Au zoo. Les singes t'attendent.)" }
    ],
    revelation: {
      titre: "Indice n°3 : le programme",
      texte: "Crêpes sur l'eau, maisons penchées, pont-cygne, marché géant, moulins… et une visite à ta famille au zoo."
    }
  },

  /* ÉTAPE 4 : le puzzle */
  puzzle: {
    titre: "La photo déchirée",
    consigne: "Le suspect a déchiré une photo du lieu. Fais glisser un morceau sur un autre pour les échanger (ou touche-les l'un après l'autre).",
    intro: "Neuf morceaux. Un amateur. On va la recoller.",
    bienPlace: ["Pile à sa place !", "Celui-là est bon.", "Tu as l'œil."],
    revelation: {
      titre: "Indice n°4 : le décor",
      texte: "Un port géant, un pont en forme de cygne, des maisons en cubes jaunes, une tour avec un nid tout en haut… Une seule ville au monde ressemble à ça."
    }
  },

  /* ÉTAPE 5 : le message codé (les lettres viennent de « ville » ci-dessus) */
  code: {
    titre: "Le message codé",
    consigne: "On a intercepté un message du suspect. Utilise la grille pour le déchiffrer, lettre par lettre.",
    intro: "Le dernier verrou. Après ça, tu sauras tout.",
    grille: "Grille de décodage",
    // une lettre → un symbole (toutes les lettres de la ville doivent y être)
    symboles: { R: "🌷", O: "🚲", T: "🧀", E: "🦢", D: "⛵", A: "🐒", M: "🥞" },
    // fausses lettres pour brouiller les pistes
    leurres: { S: "🧇", L: "🌙", N: "🎈" },
    erreurs: ["Hmm, regarde bien la grille.", "Pas celle-là… compare les symboles.", "Presque ! Je crois en toi."],
    boutonIndice: "Un coup de pouce",
    resolu: "Affaire résolue"

  /* ───────── 6. L'ÉCRAN FINAL ───────── */
  final: {
    avant: "Direction",
    titre: "{ville}\u00a0!",
    sousTitre: "Du {debut} au {fin}. Toi, moi, et une nouvelle année.",
    banniere: "{elle} + {lui}",
    compteTitre: "Départ dans",
    unites: ["jours", "heures", "min", "s"],
    compteFini: "C'est aujourd'hui ! Fais ta valise !",
    programmeTitre: "Le programme",
    programmeAide: "Touche une carte pour la retourner.",
    lettreTitre: "Une lettre pour toi",
    lettreBouton: "Ouvrir la lettre",
    lettre: [
      "Mon {surnom},",
      "Bravo, enquêtrice : affaire résolue. Le coupable, c'est moi. Je plaide coupable de tout : d'avoir tout préparé en cachette, d'avoir fait l'innocent quand tu me demandais ce que je regardais sur mon téléphone, et surtout d'être complètement fou de toi.",
      "{nbJours} jours rien que nous deux, des crêpes sur l'eau, une nouvelle année qui commence avec toi et tes mains froides dans mes poches.",
      "J'ai hâte de me perdre là-bas avec toi. Et à minuit, c'est toi que j'embrasse en premier.",
      "Je t'aime."
    ],
    signature: "{lui}",
    rejouer: "Rejouer l'enquête",
    confettis: "Encore des confettis 🎉"

  /* Le programme jour par jour (la date est calculée toute seule à partir du départ).
     surprise: true = la carte affiche « Surprise » tant qu'on ne l'a pas retournée. */
  jours: [
    { titre: "L'arrivée", emoji: "🧳", activites: [
      "On pose les valises au QG",
      "Les maisons cubes (on visite celle qui se visite)",
      "Dîner-dégustation au Markthal, le marché au plafond géant",
      "Le pont Erasmus de nuit, main dans la main" ] },
    { titre: "La surprise", emoji: "🎆", surprise: true, activites: [
      "Réveillon à Rotterdam : le grand feu d'artifice au-dessus du pont Erasmus",
      "Des oliebollen tout chauds (les beignets du Nouvel An)",
      "Minuit : le premier bisou de 2027" ] },
    { titre: "Grasse mat' de l'an neuf", emoji: "🥐", activites: [
      "Réveil quand on veut (vers midi, soyons honnêtes)",
      "Brunch en pyjama, ou presque",
      "Balade sur les quais, bien emmitouflés" ] },
    { titre: "La ville d'en haut", emoji: "🗼", activites: [
      "L'Euromast : la ville vue de très haut",
      "Le bateau-crêpes sur la Meuse (à volonté)",
      "Le Depot Boijmans, le musée-miroir et son toit-jardin",
      "Apéro dans la Witte de Withstraat" ] },
    { titre: "Moulins et vélos", emoji: "🚲", activites: [

    { titre: "Visite familiale", emoji: "🐒", activites: [

    { titre: "Le retour", emoji: "🚆", activites: [

  ui: {
    son: "Son",
    carnet: "Indices",

<style>
/* ================================================================
   STYLE — couleurs, polices, mises en page.
   Les couleurs principales sont ici, modifiables en un seul endroit.
   ================================================================ */
:root {
  --nuit: #14213d;        /* fond « polar » bleu nuit */
  --nuit-2: #1d2f57;
  --bleu: #21468b;        /* bleu du drapeau néerlandais */
  --bleu-ciel: #8fb8ff;
  --orange: #ff6b1a;      /* orange néerlandais */
  --orange-fonce: #c94a00;
  --rose: #ff4f86;        /* touche romantique */
  --rose-pale: #ffd9e5;
  --rouge: #d7263d;
  --jaune: #ffd23f;       /* maisons cubes */
  --vert: #1f9d5c;
  --papier: #fffaf3;      /* feuilles du dossier */
  --manille: #f3cf8e;     /* chemise cartonnée */
  --encre: #1b1d33;
  --encre-douce: #4a4c66;
  --ombre: 0 10px 28px rgba(5, 10, 30, .35), 0 2px 6px rgba(5, 10, 30, .25);
  --rayon: 20px;
  --barre-h: 60px;
  --horizon-h: 92px;
  --titre: "Bowlby One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --texte: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --machine: "Special Elite", "Courier New", monospace;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--texte);
  font-size: 17px;
  line-height: 1.45;
  color: var(--papier);
  background:
    radial-gradient(120% 60% at 50% -10%, #2a4277 0%, transparent 60%),
    var(--nuit);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--rose); color: #fff; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 10px; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
.visuellement-cache { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html { scrollbar-color: var(--orange) var(--nuit); }

/* Projecteur qui balaie le fond (ambiance polar) */
.projecteur {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 236, 190, .13), transparent 70%) no-repeat;
  background-size: 70vmax 70vmax;
  animation: balayage 14s ease-in-out infinite alternate;
}
@keyframes balayage {
  from { background-position: 10% 20%; }
  to   { background-position: 90% 45%; }
}

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 56px; padding: .7em 1.6em;
  border: 0; border-radius: 999px;
  background: var(--orange); color: #fff;
  font-family: var(--texte); font-weight: 600; font-size: 1.1rem; letter-spacing: .01em;
  box-shadow: 0 6px 0 var(--orange-fonce), 0 12px 24px rgba(0, 0, 0, .25);
  transition: transform .15s cubic-bezier(.2, .9, .3, 1.4), box-shadow .15s, background .2s;
}
.btn:hover { background: #ff7d36; }
.btn:active { transform: translateY(4px) scale(.98); box-shadow: 0 2px 0 var(--orange-fonce), 0 6px 12px rgba(0, 0, 0, .25); }
.btn-rose { background: var(--rose); box-shadow: 0 6px 0 #c42a5f, 0 12px 24px rgba(0, 0, 0, .25); }
.btn-rose:hover { background: #ff6798; }
.btn-rose:active { box-shadow: 0 2px 0 #c42a5f, 0 6px 12px rgba(0, 0, 0, .25); }
.btn-discret {
  background: transparent; color: inherit; box-shadow: none;
  border: 2px solid currentColor; min-height: 48px; font-size: 1rem;
}
.btn-discret:hover { background: rgba(255, 255, 255, .08); }
.btn-discret:active { box-shadow: none; }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }

/* ---------- Barre du haut ---------- */
.barre {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  height: calc(var(--barre-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(to bottom, rgba(20, 33, 61, .96) 70%, rgba(20, 33, 61, 0));
}
.icone-btn {
  flex: none; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .25);
  transition: transform .15s, background .2s;
}
.icone-btn:hover { background: rgba(255, 255, 255, .18); }
.icone-btn:active { transform: scale(.92); }
.icone-btn svg { width: 22px; height: 22px; }
.pastille {
  position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px; background: var(--rose); color: #fff; font-size: .75rem; font-weight: 700;
  display: grid; place-items: center;
}
.pastille.pop { animation: pop .5s cubic-bezier(.2, .9, .3, 1.6); }

/* Barre de progression : un vélo qui fait éclore des tulipes */
.progres { flex: 1; position: relative; height: 46px; min-width: 0; }
.progres[hidden] + * { margin-left: auto; }
.route {
  position: absolute; left: 6px; right: 6px; bottom: 9px; height: 4px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .35) 0 10px, transparent 10px 18px);
}
.route-faite {
  position: absolute; left: 6px; bottom: 9px; height: 4px; border-radius: 2px;
  width: calc((100% - 12px) * var(--p, 0)); background: var(--orange);
  transition: width 1.4s cubic-bezier(.3, .8, .3, 1);
}
.jalon { position: absolute; bottom: 10px; width: 22px; height: 30px; transform: translateX(-50%); }
.jalon svg { width: 100%; height: 100%; overflow: visible; }
.jalon .fleur { transform-origin: 11px 12px; transform: scale(.35); fill: #6fbf73; transition: transform .6s cubic-bezier(.2, .9, .3, 1.6), fill .3s; }
.jalon.eclos .fleur { transform: scale(1); fill: var(--rose); }
.jalon:nth-of-type(even).eclos .fleur { fill: var(--orange); }
.velo {
  position: absolute; bottom: 8px; width: 44px; height: 30px;
  left: calc((100% - 44px) * var(--p, 0));
  transition: left 1.4s cubic-bezier(.3, .8, .3, 1);
}
.velo svg { width: 100%; height: 100%; overflow: visible; }
.velo .roue { transform-box: fill-box; transform-origin: center; }
.velo.roule .roue { animation: tourne .35s linear infinite; }
.velo.roule { animation: cahot .25s ease-in-out infinite alternate; }
@keyframes tourne { to { transform: rotate(360deg); } }
@keyframes cahot { to { translate: 0 -1.5px; } }
.compteur-etape { font-family: var(--machine); font-size: .85rem; color: var(--manille); flex: none; min-width: 2.6em; text-align: center; }

/* ---------- Écrans ---------- */
main {
  position: relative; z-index: 2;
  padding: calc(var(--barre-h) + env(safe-area-inset-top) + 8px) 16px calc(var(--horizon-h) + 24px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}
.ecran { max-width: 560px; margin: 0 auto; }
.ecran.entre { animation: entree .65s cubic-bezier(.2, .8, .2, 1) both; }
.ecran.sort { animation: sortie .35s ease-in both; }
@keyframes entree { from { opacity: 0; transform: translateY(26px) scale(.98); filter: blur(4px); } }
@keyframes sortie { to { opacity: 0; transform: translateY(-18px) scale(.98); filter: blur(3px); } }
.cascade > * { animation: entree .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms + 120ms); }

/* La feuille de papier du dossier */
.feuille {
  position: relative;
  background: var(--papier); color: var(--encre);
  border-radius: var(--rayon);
  padding: 22px 18px 22px;
  box-shadow: var(--ombre);
}
.feuille::before { /* trombone */
  content: ""; position: absolute; top: -14px; right: 34px; width: 16px; height: 44px;
  border: 3px solid #9aa3b5; border-radius: 10px; border-bottom-color: transparent; transform: rotate(8deg);
}
.etape-titre {
  font-family: var(--titre); font-weight: 400; font-size: clamp(1.7rem, 7.4vw, 2.3rem); line-height: 1.02;
  margin: 4px 0 8px; color: var(--bleu); letter-spacing: -.01em; text-wrap: balance;
}
.consigne { margin: 0 0 14px; color: var(--encre-douce); font-size: 1rem; text-wrap: pretty; }

/* ---------- Le singe détective (acolyte) ---------- */
.acolyte { display: flex; align-items: flex-end; gap: 10px; margin: 6px 0 16px; min-height: 64px; }
.singe {
  flex: none; position: relative; width: 60px; height: 60px; border-radius: 50%;
  display: grid; place-items: center; font-size: 36px; line-height: 1;
  background: radial-gradient(circle at 35% 30%, #ffe7d2, #f6b98f);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .08), 0 4px 10px rgba(0, 0, 0, .15);
}
.singe .chapeau { position: absolute; width: 50px; top: -17px; left: 6px; transform: rotate(-12deg); pointer-events: none; }
.singe.content { animation: saut .6s cubic-bezier(.3, .7, .4, 1.5); }
.singe.oups { animation: secoue .45s ease-in-out; }
@keyframes saut { 30% { transform: translateY(-14px) rotate(-6deg); } 60% { transform: translateY(0) rotate(4deg); } }
@keyframes secoue { 20%, 60% { transform: translateX(-6px) rotate(-5deg); } 40%, 80% { transform: translateX(6px) rotate(5deg); } }
.bulle {
  position: relative; flex: 1; min-height: 48px;
  background: #fff; color: var(--encre); border: 2px solid var(--encre);
  border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: .98rem; font-weight: 500;
  box-shadow: 0 3px 0 var(--encre);
}
.bulle::before { content: ""; position: absolute; left: -11px; bottom: 8px; width: 14px; height: 14px; background: #fff; border-left: 2px solid var(--encre); border-bottom: 2px solid var(--encre); transform: skewY(35deg); }
.bulle.parle { animation: bulle .35s cubic-bezier(.2, .9, .3, 1.4); }
@keyframes bulle { from { transform: scale(.92); opacity: .4; } }

/* ---------- Accueil ---------- */
.accueil { text-align: center; padding-top: 10px; }
.chemise {
  position: relative; margin: 30px auto 0; max-width: 440px;
  background: var(--manille); color: var(--encre);
  border-radius: 6px 18px 18px 18px; padding: 22px 18px 20px;
  box-shadow: var(--ombre);
  transform: rotate(-1.2deg);
}
.chemise::before { /* onglet de la chemise */
  content: attr(data-onglet); position: absolute; top: -26px; left: 0; height: 28px; padding: 4px 18px 0;
  background: var(--manille); border-radius: 10px 14px 0 0; font-family: var(--machine); font-size: .85rem; color: #6b4a16;
}
.polaroid {
  width: 52%; max-width: 220px; margin: 8px auto 12px; background: #fff; padding: 10px 10px 34px;
  box-shadow: 0 8px 18px rgba(0, 0, 0, .25); transform: rotate(3deg); position: relative;
}
.polaroid .photo { aspect-ratio: 1; background: #26324f; overflow: hidden; display: grid; place-items: center; }
.polaroid .photo img { width: 100%; height: 100%; object-fit: cover; }
.polaroid figcaption { position: absolute; bottom: 8px; left: 0; right: 0; font-family: var(--machine); font-size: .85rem; color: var(--encre-douce); }
.scotch { position: absolute; top: -12px; left: 50%; width: 90px; height: 24px; transform: translateX(-50%) rotate(-4deg); background: rgba(255, 255, 255, .55); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.tampon {
  position: absolute; top: 46%; right: -6px; z-index: 3;
  font-family: var(--machine); font-size: 1.45rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--rouge); border: 4px double var(--rouge); border-radius: 8px; padding: 4px 12px;
  transform: rotate(-14deg); mix-blend-mode: multiply; opacity: .9;
  animation: tamponne .5s .9s cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes tamponne { from { transform: rotate(-14deg) scale(2.6); opacity: 0; } 60% { opacity: .95; } }
.accueil h1 {
  font-family: var(--titre); font-weight: 400; margin: 6px 0 10px;
  font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: .98; color: var(--bleu); letter-spacing: -.015em; text-wrap: balance;
}
.dossier-num { font-family: var(--machine); color: #6b4a16; font-size: .95rem; margin: 0; }
.question-accueil { font-size: 1.15rem; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
.agent { font-family: var(--machine); font-size: .9rem; margin: 10px 0 0; color: #6b4a16; }
@media (max-height: 700px) { .accueil .polaroid { width: 44%; } .accueil h1 { font-size: clamp(2rem, 9.6vw, 3rem); } .chemise { margin-top: 26px; } }
.accueil .btn { margin-top: 22px; font-size: 1.2rem; min-height: 62px; padding-inline: 2em; }
.note-son { font-size: .85rem; color: rgba(255, 250, 243, .7); margin: 16px auto 0; max-width: 30ch; }
.loupe-flotte { animation: flotte 3s ease-in-out infinite; }
@keyframes flotte { 50% { transform: translateY(-6px) rotate(6deg); } }

/* ---------- Briefing ---------- */
.briefing .rapport { font-family: var(--machine); font-size: 1.08rem; line-height: 1.6; min-height: 12em; }
.briefing .rapport p { margin: 0 0 .8em; }
.curseur { display: inline-block; width: .55em; height: 1.1em; background: var(--encre); vertical-align: -.15em; animation: clignote 1s steps(1) infinite; }
@keyframes clignote { 50% { opacity: 0; } }
.briefing .btn { margin-top: 10px; width: 100%; }
.astuce-passer { font-size: .85rem; color: var(--encre-douce); text-align: center; margin: 10px 0 0; }

/* ---------- Étape 1 : la scène aux objets cachés ---------- */
.scene {
  position: relative; aspect-ratio: 3 / 4; width: 100%; max-width: 440px; margin: 0 auto;
  border-radius: 16px; overflow: hidden; container-type: inline-size;
  box-shadow: inset 0 0 0 3px var(--encre);
}
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .avant-plan { z-index: 4; pointer-events: none; }
.objet {
  position: absolute; z-index: 2;
  left: calc(var(--x) / 300 * 100%); top: calc(var(--y) / 400 * 100%);
  transform: translate(-50%, -50%) rotate(var(--r, 0deg));
  font-size: 24px; font-size: calc(var(--s, 24) * 100cqw / 300);
  line-height: 1; padding: 7px; background: none; border: 0; border-radius: 50%;
  transition: transform .2s;
}
.objet.cible { z-index: 3; }
.objet:active { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(.9); }
.objet.trouve { animation: trouve .7s cubic-bezier(.2, .9, .3, 1.5) forwards; pointer-events: none; }
@keyframes trouve {
  40% { transform: translate(-50%, -50%) scale(1.9) rotate(0deg); filter: drop-shadow(0 0 8px #fff); }
  100% { transform: translate(-50%, -50%) scale(1.25); filter: drop-shadow(0 0 6px var(--jaune)); }
}
.objet.trouve::after {
  content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 3px solid var(--vert); background: rgba(31, 157, 92, .15);
}
.objet.indice-actif::before {
  content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px dashed var(--jaune);
  animation: halo 1s ease-in-out infinite;
}
@keyframes halo { 50% { transform: scale(1.25); opacity: .4; } }
.objet.non { animation: non .4s; }
@keyframes non { 25% { transform: translate(-60%, -50%) rotate(var(--r, 0deg)); } 75% { transform: translate(-40%, -50%) rotate(var(--r, 0deg)); } }
.liste-objets { display: flex; justify-content: center; gap: 8px; margin: 14px 0 4px; padding: 0; list-style: none; }
.liste-objets li {
  width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px;
  background: #efe6da; border: 2px dashed #c8b9a5;
}
.liste-objets li span { filter: brightness(0) opacity(.3); transition: filter .4s; }
.liste-objets li.ok { background: #e2f6ea; border: 2px solid var(--vert); animation: pop .5s cubic-bezier(.2, .9, .3, 1.6); }
.liste-objets li.ok span { filter: none; }
.actions-etape { display: flex; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.actions-etape .btn-discret { color: var(--bleu); }
@keyframes pop { 40% { transform: scale(1.25); } }

/* ---------- Étape 2 : quiz ---------- */
.quiz-compte { font-family: var(--machine); font-size: .9rem; color: var(--encre-douce); margin: 0 0 4px; }
.question { font-size: 1.25rem; font-weight: 600; margin: 0 0 14px; line-height: 1.3; text-wrap: balance; }
.reponses { position: relative; display: grid; gap: 10px; align-content: start; }
@media (min-width: 540px) { .reponses { grid-template-columns: 1fr 1fr; } }
.reponse {
  min-height: 58px; padding: 10px 16px; border-radius: 16px; text-align: left;
  background: #fff; color: var(--encre); border: 2px solid var(--encre); box-shadow: 0 4px 0 var(--encre);
  font-weight: 500; font-size: 1.05rem; transition: transform .12s, box-shadow .12s, background .2s, opacity .3s;
}
.reponse:hover { background: #fff3e6; }
.reponse:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--encre); }
.reponse.bonne { background: #dff5e8; border-color: var(--vert); box-shadow: 0 4px 0 var(--vert); animation: pop .5s; }
.reponse.fausse { background: var(--rose-pale); border-color: var(--rose); box-shadow: 0 4px 0 var(--rose); animation: secoue .45s; }
.reponse.eteinte { opacity: .45; }
.reponse.fuyant { transition: left .25s cubic-bezier(.2, .9, .3, 1.3), top .25s cubic-bezier(.2, .9, .3, 1.3), transform .12s; }
.reponse.fuyant.libre { position: absolute; width: auto; min-width: 120px; z-index: 5; }
.reponses.zone-fuite { min-height: 290px; }
@media (min-width: 540px) { .reponses.zone-fuite { min-height: 220px; } }
.quiz-suite { margin-top: 18px; display: flex; justify-content: flex-end; }

/* ---------- Étape 3 : mémory ---------- */
.memory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 420px; margin: 0 auto; }
@media (min-width: 600px) { .memory { grid-template-columns: repeat(4, 1fr); max-width: 520px; } }
.carte { aspect-ratio: 3 / 4; perspective: 800px; border: 0; padding: 0; background: none; border-radius: 14px; }
.carte-int { display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, .8, .3, 1.2); }
.carte.retournee .carte-int { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; overflow: hidden; }
.face.dos {
  background:
    radial-gradient(circle at 50% 50%, transparent 13px, transparent 14px),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .07) 0 6px, transparent 6px 12px),
    var(--bleu);
  border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
}
.face.dos svg { width: 44%; }
.face.recto { transform: rotateY(180deg); background: #fff; border: 3px solid var(--orange); font-size: clamp(34px, 11vw, 48px); }
.face.recto img { width: 100%; height: 100%; object-fit: cover; }
.carte.trouvee .face.recto { border-color: var(--vert); box-shadow: 0 0 0 4px rgba(31, 157, 92, .3); }
.carte.trouvee { animation: pop .5s .3s; }
.memory-coups { text-align: center; font-family: var(--machine); color: var(--encre-douce); margin: 12px 0 0; font-size: .9rem; }

/* ---------- Étape 4 : puzzle ---------- */
.puzzle {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; max-width: 420px; margin: 0 auto;
  aspect-ratio: 1; padding: 4px; background: var(--encre); border-radius: 14px; touch-action: none;
  transition: gap .5s, padding .5s;
}
.piece {
  border: 0; padding: 0; border-radius: 6px; background-size: 300% 300%; background-repeat: no-repeat;
  cursor: grab; touch-action: none; position: relative; transition: transform .2s, opacity .2s, border-radius .5s;
}
.piece.selection { outline: 4px solid var(--orange); outline-offset: -4px; transform: scale(.94); }
.piece.source { opacity: .35; }
.piece.cible-survol { outline: 4px dashed var(--jaune); outline-offset: -4px; }
.piece.ok::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 2px #fff; }
.piece.echange { animation: pop .35s; }
.fantome { position: fixed; z-index: 60; pointer-events: none; border-radius: 8px; background-size: 300% 300%; box-shadow: 0 16px 30px rgba(0, 0, 0, .4); transform: scale(1.08) rotate(-3deg); }
.puzzle.resolu { gap: 0; padding: 0; }
.puzzle.resolu .piece { border-radius: 0; cursor: default; }
.puzzle.resolu .piece::after { display: none; }
.puzzle.resolu .piece:nth-child(1) { border-top-left-radius: 14px; }
.puzzle.resolu .piece:nth-child(3) { border-top-right-radius: 14px; }
.puzzle.resolu .piece:nth-child(7) { border-bottom-left-radius: 14px; }
.puzzle.resolu .piece:nth-child(9) { border-bottom-right-radius: 14px; }

/* ---------- Étape 5 : message codé ---------- */
.message-code { display: flex; justify-content: center; gap: clamp(3px, 1.2vw, 6px); margin: 4px 0 18px; }
.case-code { flex: 0 1 34px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 4px; }
.case-code .symb { font-size: clamp(18px, 6vw, 24px); line-height: 1.2; }
.case-code .lettre {
  width: 100%; height: 42px; border-radius: 8px; display: grid; place-items: center;
  font-family: var(--titre); font-size: 1.3rem; color: var(--bleu);
  background: #efe6da; border: 2px solid #c8b9a5;
}
.case-code.active .lettre { border-color: var(--orange); background: #fff; box-shadow: 0 0 0 3px rgba(255, 107, 26, .3); animation: halo-case 1.2s ease-in-out infinite; }
@keyframes halo-case { 50% { box-shadow: 0 0 0 6px rgba(255, 107, 26, .12); } }
.case-code.remplie .lettre { background: #fff; border-color: var(--bleu); animation: pop .4s; }
.case-code.erreur .lettre { animation: secoue .4s; border-color: var(--rose); }
.message-code.resolu .lettre { background: var(--orange); color: #fff; border-color: var(--orange); animation: vague .6s calc(var(--i) * 70ms) both; }
@keyframes vague { 40% { transform: translateY(-12px) scale(1.15); } }
.grille-titre { font-family: var(--machine); font-size: .95rem; margin: 0 0 8px; color: var(--encre-douce); }
.grille-code { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 0 0 18px; padding: 10px; border-radius: 14px; background: #f3ebe0; border: 2px dashed #c8b9a5; }
.cle { display: flex; align-items: center; justify-content: center; gap: 3px; padding: 6px 2px; border-radius: 8px; font-family: var(--titre); color: var(--encre); font-size: .95rem; transition: background .3s; }
.cle span:first-child { font-size: 1.3rem; }
.cle.eclaire { background: var(--jaune); animation: pop .5s; }
.clavier { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.touche {
  min-height: 54px; border-radius: 12px; border: 2px solid var(--encre); background: #fff; color: var(--bleu);
  font-family: var(--titre); font-size: 1.35rem; box-shadow: 0 4px 0 var(--encre); transition: transform .1s, box-shadow .1s;
}
.touche:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--encre); }

/* ---------- Fenêtres « indice découvert » et carnet ---------- */
dialog {
  border: 0; padding: 0; border-radius: 22px; background: var(--papier); color: var(--encre);
  width: min(92vw, 440px); max-height: 88dvh; box-shadow: var(--ombre); overflow: auto;
}
dialog::backdrop { background: rgba(8, 13, 30, .72); }
dialog[open] { animation: ouvre .55s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes ouvre { from { opacity: 0; transform: translateY(40px) scale(.9) rotate(-2deg); } }
.revelation-int { padding: 26px 20px 22px; text-align: center; position: relative; }
.tampon-indice {
  display: inline-block; font-family: var(--machine); text-transform: uppercase; letter-spacing: .1em; color: var(--rouge);
  border: 3px double var(--rouge); border-radius: 8px; padding: 2px 12px; transform: rotate(-6deg);
  animation: tamponne .5s .2s cubic-bezier(.3, 1.6, .5, 1) both;
}
.revelation h2 { font-family: var(--titre); font-weight: 400; font-size: 1.6rem; color: var(--bleu); margin: 14px 0 8px; line-height: 1.05; text-wrap: balance; }
.revelation p { margin: 0 0 18px; text-wrap: pretty; }
.visuel { margin: 16px auto 4px; }
.revelation .btn { width: 100%; }

/* Visuel : calendrier */
.calendrier { width: 100%; max-width: 300px; margin: 0 auto; border-radius: 14px; overflow: hidden; border: 2px solid var(--encre); background: #fff; }
.cal-tete { background: var(--rouge); color: #fff; font-family: var(--titre); padding: 6px; font-size: 1.1rem; letter-spacing: .03em; }
.cal-grille { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 8px; font-size: .9rem; }
.cal-grille .j-nom { font-weight: 600; color: var(--encre-douce); font-size: .75rem; }
.cal-grille .j { position: relative; height: 32px; display: grid; place-items: center; font-weight: 500; }
.cal-grille .j.hors { color: #b9b4c4; }
.cal-grille .j.voyage { color: #fff; font-weight: 700; }
.cal-grille .j.voyage::before { content: ""; position: absolute; inset: 1px 0; background: var(--rose); z-index: -0; border-radius: 0; animation: remplit .4s calc(var(--i) * 120ms + .4s) both; }
.cal-grille .j.voyage.premier::before { border-radius: 16px 0 0 16px; }
.cal-grille .j.voyage.dernier::before { border-radius: 0 16px 16px 0; }
.cal-grille .j span { position: relative; }
@keyframes remplit { from { transform: scaleX(0); transform-origin: left; } }

/* Visuel : drapeau + moulin */
.pays { display: flex; align-items: flex-end; justify-content: center; gap: 18px; }
.drapeau { width: 150px; height: 100px; border-radius: 6px; overflow: hidden; box-shadow: 0 6px 14px rgba(0, 0, 0, .2); animation: drapeau 2.4s ease-in-out infinite; transform-origin: left center; }
.drapeau div { height: 33.34%; }
@keyframes drapeau { 50% { transform: skewY(-3deg) scaleX(.97); } }
.moulin svg { width: 90px; height: 120px; }
.pales { transform-origin: 45px 42px; animation: tourne 5s linear infinite; }

/* Visuel : activités */
.activites { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; font-size: 38px; }
.activites span { animation: sautille 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * 120ms); }
@keyframes sautille { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px) rotate(-6deg); } }

/* Visuel : la photo recollée */
.photo-recollee { width: 100%; max-width: 280px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 3px solid var(--encre); aspect-ratio: 1; background-size: cover; position: relative; }
.censure { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%) rotate(-4deg); background: var(--encre); color: #fff; font-family: var(--machine); padding: 4px 14px; letter-spacing: .1em; font-size: .95rem; white-space: nowrap; }

/* Carnet d'indices */
.carnet-int { padding: 22px 20px; }
.carnet-int h2 { font-family: var(--titre); font-weight: 400; color: var(--bleu); margin: 0 0 12px; font-size: 1.5rem; }
.carnet-liste { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
.carnet-liste li { background: #fff; border: 2px solid var(--encre); border-radius: 14px; padding: 10px 12px; }
.carnet-liste strong { display: block; color: var(--rouge); font-family: var(--machine); font-weight: 400; }

/* ---------- Écran final ---------- */
.final { max-width: 980px; text-align: center; }
.final-haut { padding: 14px 0 6px; }
.final-avant { font-family: var(--machine); font-size: 1.2rem; color: var(--manille); margin: 0; letter-spacing: .2em; text-transform: uppercase; }
.final-titre {
  font-family: var(--titre); font-weight: 400; margin: 2px 0 8px; line-height: .95;
  font-size: clamp(2.2rem, 11vw, 6rem); color: var(--orange); letter-spacing: -.02em;
  text-shadow: 0 4px 0 var(--orange-fonce), 0 10px 26px rgba(0, 0, 0, .35);
  overflow-wrap: anywhere;
}
.final-titre .l { display: inline-block; animation: chute .8s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(var(--i) * 80ms + .2s); }
@keyframes chute { from { transform: translateY(-120px) rotate(-20deg); opacity: 0; } }
.final-sous { font-size: 1.2rem; font-weight: 500; margin: 0 auto; max-width: 30ch; text-wrap: balance; }

.voyage { position: relative; height: 130px; margin: 14px -16px 6px; overflow: hidden; }
.voyage .vehicule { position: absolute; top: 18px; left: 0; height: 92px; width: auto; animation: traverse 7s cubic-bezier(.45, .05, .55, .95) infinite; }
.voyage.train .vehicule { top: 40px; height: 72px; }
.voyage .rails { position: absolute; left: 0; right: 0; bottom: 14px; height: 6px; background: repeating-linear-gradient(90deg, #8b6b4a 0 8px, transparent 8px 22px); border-top: 2px solid #aab3c5; }
@keyframes traverse { from { transform: translateX(-110%); } to { transform: translateX(calc(100vw + 10%)); } }
.voyage.avion .vehicule { animation-name: vole; }
@keyframes vole { 0% { transform: translate(-110%, 30px) rotate(-4deg); } 50% { transform: translate(40vw, -4px) rotate(2deg); } 100% { transform: translate(calc(100vw + 10%), 18px) rotate(-3deg); } }
.nuage { position: absolute; width: 70px; height: 22px; background: rgba(255, 255, 255, .85); border-radius: 20px; filter: blur(.3px); }
.nuage::before { content: ""; position: absolute; width: 30px; height: 30px; left: 14px; top: -14px; background: inherit; border-radius: 50%; }

.compte-titre { font-family: var(--machine); color: var(--manille); margin: 18px 0 8px; letter-spacing: .1em; text-transform: uppercase; }
.compte { display: flex; justify-content: center; gap: 8px; font-variant-numeric: tabular-nums; }
.compte div { min-width: 70px; padding: 10px 6px 6px; border-radius: 14px; background: var(--papier); color: var(--bleu); box-shadow: 0 5px 0 #c9bba6; }
.compte b { display: block; font-family: var(--titre); font-weight: 400; font-size: 1.9rem; line-height: 1; }
.compte small { font-size: .8rem; color: var(--encre-douce); }

.section-finale { margin: 40px auto 0; }
.section-finale h2 { font-family: var(--titre); font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.2rem); margin: 0 0 4px; color: var(--papier); }
.aide { margin: 0 0 14px; color: rgba(255, 250, 243, .75); font-size: .95rem; }
.jours {
  display: grid; grid-auto-flow: column; grid-auto-columns: 74%; gap: 14px;
  overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 16px 18px; margin: 0 -16px;
  scrollbar-width: thin;
}
@media (min-width: 900px) { .jours { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); overflow: visible; margin: 0; padding: 8px 0; } }
.jour { scroll-snap-align: center; aspect-ratio: 3 / 4; perspective: 1000px; border: 0; padding: 0; background: none; text-align: left; border-radius: 18px; }
.jour .carte-int { transition-duration: .7s; }
.jour.retournee .carte-int { transform: rotateY(180deg); }
.jour .face { border-radius: 18px; padding: 16px; align-content: center; justify-items: center; text-align: center; color: var(--encre); }
.jour .face.dos { background: var(--papier); border: 3px solid var(--orange); box-shadow: 0 8px 18px rgba(0, 0, 0, .3); }
.jour:nth-child(even) .face.dos { border-color: var(--rose); }
.jour .face.dos .emoji-jour { font-size: 64px; line-height: 1; margin-bottom: 10px; }
.jour .num-jour { font-family: var(--machine); color: var(--encre-douce); font-size: .9rem; }
.jour .titre-jour { font-family: var(--titre); font-size: 1.35rem; color: var(--bleu); line-height: 1.05; margin-top: 4px; }
.jour.surprise .face.dos { background: repeating-linear-gradient(45deg, var(--rose) 0 14px, #ff6a99 14px 28px); border-color: #fff; color: #fff; }
.jour.surprise .face.dos .titre-jour, .jour.surprise .face.dos .num-jour { color: #fff; }
.jour .face.recto { background: var(--bleu); border: 3px solid #fff; color: #fff; font-size: 1rem; align-content: start; justify-items: start; text-align: left; }
.jour .titre-recto { display: block; font-family: var(--titre); font-weight: 400; margin: 0 0 10px; font-size: 1.15rem; color: var(--jaune); line-height: 1.1; }
.jour .liste-act { display: grid; gap: 7px; font-size: .97rem; line-height: 1.3; }
.jour .liste-act span { position: relative; padding-left: 16px; display: block; }
.jour .liste-act span::before { content: ""; position: absolute; left: 2px; top: .48em; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
.jour .num-jour, .jour .titre-jour, .jour .emoji-jour { display: block; }

/* Le grand tampon « Affaire résolue » */
.tampon-final {
  position: fixed; left: 50%; top: 45%; z-index: 70; pointer-events: none;
  transform: translate(-50%, -50%) rotate(-12deg);
  font-family: var(--machine); text-transform: uppercase; white-space: nowrap;
  font-size: clamp(1.9rem, 9vw, 4rem); color: var(--rouge);
  border: 6px double var(--rouge); border-radius: 14px; padding: 6px 22px; background: rgba(255, 250, 243, .94);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
  animation: tamponne-final .55s cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes tamponne-final { from { transform: translate(-50%, -50%) rotate(-12deg) scale(3); opacity: 0; } }

/* Fond chaleureux de l'écran final */
body.fin {
  background:
    radial-gradient(90% 55% at 50% 0%, rgba(255, 79, 134, .35), transparent 65%),
    radial-gradient(70% 40% at 85% 20%, rgba(255, 107, 26, .25), transparent 70%),
    var(--nuit);
}
[tabindex="-1"]:focus { outline: none; }

.infos { display: grid; gap: 12px; max-width: 640px; margin: 28px auto 0; text-align: left; }
@media (min-width: 600px) { .infos { grid-template-columns: 1fr 1fr; } }
.info { display: flex; gap: 12px; align-items: flex-start; background: rgba(255, 255, 255, .07); border: 2px solid rgba(255, 255, 255, .18); border-radius: 18px; padding: 14px; }
.info svg { flex: none; width: 38px; height: 38px; }
.info h3 { margin: 0 0 2px; font-size: 1.05rem; color: var(--jaune); }
.info p { margin: 0; font-size: .98rem; }

.lettre-zone { display: grid; gap: 22px; justify-items: center; }
@media (min-width: 760px) { .lettre-zone { grid-template-columns: 260px 1fr; align-items: center; max-width: 820px; margin: 0 auto; } }
.polaroid.nous { width: 220px; max-width: 70%; transform: rotate(-4deg); }
.polaroid.nous .photo { background: var(--rose-pale); }
.enveloppe { position: relative; width: 100%; max-width: 460px; }
.enveloppe-btn {
  width: 100%; aspect-ratio: 16 / 10; border: 0; padding: 0; border-radius: 12px; position: relative; overflow: hidden;
  background: #f7e3c4; box-shadow: var(--ombre);
}
.enveloppe-btn::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top right, #edd3ab 50%, transparent 50.5%) left / 50% 100% no-repeat, linear-gradient(to top left, #edd3ab 50%, transparent 50.5%) right / 50% 100% no-repeat; }
.rabat { position: absolute; left: 0; right: 0; top: 0; height: 58%; background: #e9c995; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .6s; }
.sceau { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: var(--rouge); display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); transition: transform .3s; }
.sceau svg { width: 30px; height: 30px; }
.enveloppe-btn:hover .sceau { transform: translate(-50%, -50%) scale(1.08) rotate(-8deg); }
.enveloppe-btn .lib { position: absolute; left: 0; right: 0; bottom: 12px; color: #6b4a16; font-weight: 600; }
#lettre {
  background: var(--papier); color: var(--encre); border-radius: 14px; padding: 26px 22px; text-align: left;
  box-shadow: var(--ombre); font-size: 1.08rem; line-height: 1.6;
  background-image: repeating-linear-gradient(to bottom, transparent 0 calc(1.6em - 1px), rgba(33, 70, 139, .12) calc(1.6em - 1px) 1.6em);
  background-position: 0 26px;
}
#lettre.ouvre { animation: lettre .9s cubic-bezier(.2, .9, .3, 1.1) both; }
@keyframes lettre { from { transform: translateY(60px) scale(.9); opacity: 0; clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
#lettre p { margin: 0 0 .8em; max-width: 60ch; }
#lettre .signature { font-family: var(--titre); color: var(--rose); font-size: 1.5rem; margin: 6px 0 0; }
.boutons-fin { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 36px 0 10px; }

/* ---------- Horizon néerlandais (se construit au fil des indices) ---------- */
.horizon { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--horizon-h) + env(safe-area-inset-bottom)); z-index: 1; pointer-events: none; }
.horizon svg { width: 100%; height: 100%; display: block; }
.horizon .couche { opacity: 0; transform: translateY(24px); transition: opacity 1.2s, transform 1.4s cubic-bezier(.2, .9, .3, 1.2); }
.horizon .couche.visible { opacity: 1; transform: none; }
.vague { animation: vague-eau 6s ease-in-out infinite alternate; }
@keyframes vague-eau { to { transform: translateX(-30px); } }
.bateau-h { animation: navigue 26s linear infinite; }
@keyframes navigue { from { transform: translateX(-60px); } to { transform: translateX(1300px); } }

/* Paillettes et confettis */
#particules { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 80; pointer-events: none; }

/* ---------- Grands écrans ---------- */
@media (min-width: 760px) {
  body { font-size: 18px; }
  .feuille { padding: 30px 32px; }
  :root { --horizon-h: 130px; }
}

/* ---------- Mouvement réduit : on coupe les animations ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .projecteur { display: none; }
  .voyage .vehicule { transform: translateX(30vw) !important; }
}
</style>
</head>

          <rect width="300" height="284" fill="url(#papier-peint)"/>

<script>
/* ================================================================
   MOTEUR DU JEU — tu n'as pas besoin de modifier ce qui suit.
   (Tous les textes sont dans CONFIG, en haut du fichier.)
   ================================================================ */
(() => {
"use strict";

/* ---------- Petits outils ---------- */
const $ = (s, p = document) => p.querySelector(s);
const $$ = (s, p = document) => [...p.querySelectorAll(s)];
const moinsDeMouvement = matchMedia("(prefers-reduced-motion: reduce)").matches;
const attendre = ms => new Promise(r => setTimeout(r, moinsDeMouvement ? Math.min(ms, 150) : ms));
const hasard = arr => arr[Math.floor(Math.random() * arr.length)];
const melange = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const creer = (tag, attrs = {}, html = "") => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k === "style") el.style.cssText = v; else el.setAttribute(k, v);
  }
  if (html) el.innerHTML = html;
  return el;
};
const stockage = {
  lire(cle, defaut) { try { const v = localStorage.getItem("enquete-" + cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } },
  ecrire(cle, val) { try { localStorage.setItem("enquete-" + cle, JSON.stringify(val)); } catch (e) { /* navigation privée : tant pis */ } }
};

/* ---------- Dates et mots-clés {elle}, {lui}… ---------- */
const dateDepart = new Date(CONFIG.depart);
const dateRetour = new Date(CONFIG.retour + "T12:00");
const jourSeul = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const nbJours = Math.round((jourSeul(dateRetour) - jourSeul(dateDepart)) / 864e5) + 1;
const fmtLong = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const fmtCourt = new Intl.DateTimeFormat("fr-FR", { weekday: "short", day: "numeric", month: "long" });
const VARS = {
  elle: CONFIG.elle, lui: CONFIG.lui, surnom: CONFIG.surnom, ville: CONFIG.ville,
  debut: fmtLong.format(dateDepart), fin: fmtLong.format(dateRetour), nbJours, numero: CONFIG.numero
};
const T = s => String(s ?? "").replace(/\{(\w+)\}/g, (m, k) => (k in VARS ? VARS[k] : m));
const echapper = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lire = chemin => chemin.split(".").reduce((o, k) => (o == null ? o : o[k]), CONFIG);

/* ---------- Sons (fabriqués en direct, aucun fichier audio) ---------- */
const Son = (() => {
  let ctx = null;
  let actif = stockage.lire("son", CONFIG.son);
  function contexte() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function note(freq, debut, duree, type = "sine", vol = .16, glisse) {
    const c = contexte(); if (!c) return;
    const t = c.currentTime + debut;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glisse) o.frequency.exponentialRampToValueAtTime(glisse, t + duree);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + duree);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + duree + .05);
  }
  const sons = {
    tap:      () => note(700, 0, .07, "triangle", .07),
    bien:     () => { note(784, 0, .14, "triangle", .15); note(1175, .09, .24, "triangle", .13); },
    oups:     () => note(340, 0, .34, "sine", .16, 150),
    indice:   () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * .09, .32, "triangle", .13)),
    sonnette: () => { note(2093, 0, .28, "sine", .09); note(2093, .17, .4, "sine", .09); },
    carte:    () => note(480, 0, .06, "square", .035, 820),
    tampon:   () => note(120, 0, .2, "square", .1, 55),
    touche:   () => note(1700 + Math.random() * 500, 0, .025, "square", .02),
    fanfare:  () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * .13, i === 6 ? .9 : .22, "triangle", .14))
  };
  return {
    jouer(nom) { if (actif && sons[nom]) { try { sons[nom](); } catch (e) { /* pas de son, pas grave */ } } },
    get actif() { return actif; },
    basculer() { actif = !actif; stockage.ecrire("son", actif); if (actif) this.jouer("bien"); return actif; }
  };
})();

/* ---------- Particules : paillettes, cœurs, confettis ---------- */
const Particules = (() => {
  const cv = $("#particules"), cx = cv.getContext("2d");
  let parts = [], anim = null;
  const COULEURS = ["#ff6b1a", "#ff4f86", "#21468b", "#fffaf3", "#ffd23f", "#d7263d", "#8fb8ff"];
  function taille() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", taille); taille();
  const formes = {
    rect(t, p) { cx.fillRect(-t / 2, -t / 4, t, (t / 2) * (Math.cos(p.rot * 3) * .5 + .75)); },
    coeur(t) { cx.beginPath(); cx.moveTo(0, t * .35); cx.bezierCurveTo(-t, -t * .2, -t * .45, -t * .9, 0, -t * .35); cx.bezierCurveTo(t * .45, -t * .9, t, -t * .2, 0, t * .35); cx.fill(); },
    etoile(t) { cx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? t * .3 : t; const a = i * Math.PI / 4; cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } cx.fill(); },
    tulipe(t) { cx.beginPath(); cx.moveTo(-t * .6, -t * .5); cx.lineTo(-t * .3, -t * .1); cx.lineTo(0, -t * .55); cx.lineTo(t * .3, -t * .1); cx.lineTo(t * .6, -t * .5); cx.quadraticCurveTo(t * .7, t * .5, 0, t * .5); cx.quadraticCurveTo(-t * .7, t * .5, -t * .6, -t * .5); cx.fill(); }
  };
  function boucle() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.vie > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vx *= p.frein; p.vy = p.vy * p.frein + p.g;
      p.x += p.vx + Math.sin(p.vie * .08) * p.flotte; p.y += p.vy; p.rot += p.vr; p.vie--;
      cx.save();
      cx.globalAlpha = Math.min(1, p.vie / 25);
      cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
      formes[p.forme](p.t, p);
      cx.restore();
    }
    anim = parts.length ? requestAnimationFrame(boucle) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
  }
  const lancer = () => { if (!anim) anim = requestAnimationFrame(boucle); };
  function eclat(x, y, n, opts) {
    if (moinsDeMouvement) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = opts.vitesse * (.5 + Math.random());
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opts.monte || 0), g: opts.g, frein: opts.frein,
        vie: opts.vie * (.7 + Math.random() * .6), rot: Math.random() * 6, vr: (Math.random() - .5) * .3, flotte: opts.flotte || 0,
        t: opts.t * (.7 + Math.random() * .6), c: hasard(opts.couleurs || COULEURS), forme: hasard(opts.formes)
      });
    }
    lancer();
  }
  return {
    paillettes: (x, y, n = 6) => eclat(x, y, n, { vitesse: 2.6, g: .04, frein: .9, vie: 34, t: 4, formes: ["etoile"], couleurs: ["#ffd23f", "#fffaf3", "#ff4f86"] }),
    coeurs: (x, y, n = 12) => eclat(x, y, n, { vitesse: 4, g: -.03, frein: .95, vie: 70, t: 9, formes: ["coeur"], couleurs: ["#ff4f86", "#d7263d", "#ff8fb1"], monte: 1.5, flotte: .4 }),
    confettis(n = 170) {
      if (moinsDeMouvement) return;
      const canons = [[0, innerHeight * .85, 1], [innerWidth, innerHeight * .85, -1]];
      for (const [x, y, sens] of canons) {
        for (let i = 0; i < n / 2; i++) {
          const v = 10 + Math.random() * 12, a = (-60 - Math.random() * 25) * Math.PI / 180;
          parts.push({
            x, y, vx: Math.cos(a) * v * sens, vy: Math.sin(a) * v, g: .28, frein: .975,
            vie: 160 + Math.random() * 90, rot: Math.random() * 6, vr: (Math.random() - .5) * .35, flotte: .6,
            t: 8 + Math.random() * 7, c: hasard(COULEURS), forme: hasard(["rect", "rect", "rect", "coeur", "tulipe"])
          });
        }
      }
      lancer();
    },
    pluie(n = 60) {
      if (moinsDeMouvement) return;
      for (let i = 0; i < n; i++) parts.push({
        x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5, vx: 0, vy: 1 + Math.random() * 2, g: .02, frein: .995,
        vie: 400, rot: Math.random() * 6, vr: (Math.random() - .5) * .1, flotte: .8, t: 8 + Math.random() * 6,
        c: hasard(["#ff4f86", "#ff6b1a", "#d7263d", "#ffd23f"]), forme: hasard(["tulipe", "coeur"])
      });
      lancer();
    }
  };
})();

const indicesTrouves = [];
const VISUELS = {
  calendrier() {
    const premier = new Date(dateDepart.getFullYear(), dateDepart.getMonth(), 1);
    const debutGrille = new Date(jourSeul(dateDepart)); debutGrille.setDate(debutGrille.getDate() - ((debutGrille.getDay() + 6) % 7));
    const finGrille = new Date(jourSeul(dateRetour)); finGrille.setDate(finGrille.getDate() + (6 - ((finGrille.getDay() + 6) % 7)));
    const fmtMois = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" });
    const fmtMoisCourt = new Intl.DateTimeFormat("fr-FR", { month: "short", year: "numeric" });
    const mois = premier.getMonth() === dateRetour.getMonth() ? fmtMois.format(premier) : `${fmtMoisCourt.format(premier)} → ${fmtMoisCourt.format(dateRetour)}`;
    let cases = ["L", "M", "M", "J", "V", "S", "D"].map(j => `<div class="j-nom">${j}</div>`).join("");
    let i = 0;
    for (let d = new Date(debutGrille); d <= finGrille; d.setDate(d.getDate() + 1)) {
      const dans = d >= jourSeul(dateDepart) && d <= jourSeul(dateRetour);
      const cls = ["j", !dans && d.getMonth() !== dateDepart.getMonth() && d.getMonth() !== dateRetour.getMonth() ? "hors" : "", dans ? "voyage" : "",

    }

const Etape1 = {
  trouves: new Set(),

/* ================================================================
   ÉTAPE 2 — L'interrogatoire (quiz)
   ================================================================ */
const Etape2 = {
  i: 0,
  repondu: false,
  demarrer() {
    this.i = 0;
    dire(CONFIG.quiz.intro);
    this.afficher();
    $("#btn-question-suivante").onclick = () => {
      Son.jouer("tap");
      this.i++;
      if (this.i < CONFIG.quiz.questions.length) this.afficher();
      else etapeReussie(2);
    };
  },
  afficher() {
    const qs = CONFIG.quiz.questions, q = qs[this.i], zone = $("#reponses");
    this.repondu = false;
    $("#quiz-compte").textContent = `Question ${this.i + 1}/${qs.length}`;
    const question = $("#question");
    question.textContent = T(q.q);
    question.classList.remove("parle"); void question.offsetWidth;
    zone.innerHTML = "";
    zone.classList.toggle("zone-fuite", q.reponses.some(r => r.fuyant));
    $("#btn-question-suivante").hidden = true;
    q.reponses.forEach(r => {
      const b = creer("button", { class: "reponse", type: "button" });
      b.textContent = T(r.t);
      if (r.fuyant) this.fuyant(b, zone, q);
      else b.addEventListener("click", e => this.choisir(r, b, q, e));
      zone.append(b);
    });
    if (this.i > 0) question.focus({ preventScroll: true });
  },
  choisir(r, b, q, e) {
    if (this.repondu) return;
    this.repondu = true;
    const boutons = $$("#reponses .reponse");
    boutons.forEach(x => { if (x !== b) x.classList.add("eteinte"); x.setAttribute("aria-disabled", "true"); });
    if (r.ok) {
      b.classList.add("bonne");
      Son.jouer("bien");
      Particules.paillettes(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, 14);
      dire(r.r, "content");
    } else {
      b.classList.add("fausse");
      Son.jouer("oups");
      dire(r.r, "oups");
      setTimeout(() => boutons.forEach((x, k) => { if (q.reponses[k] && q.reponses[k].ok) { x.classList.remove("eteinte"); x.classList.add("bonne"); } }), 900);
    }
    if (q.apres) setTimeout(() => dire(q.apres, "content"), 1900);
    const suivant = $("#btn-question-suivante");
    $("span", suivant).textContent = this.i === CONFIG.quiz.questions.length - 1 ? CONFIG.ui.continuer : CONFIG.quiz.suivant;
    setTimeout(() => { suivant.hidden = false; }, q.apres ? 1900 : 700);
  },
  // Le bouton « Non » qui s'enfuit… et finit par dire oui
  fuyant(b, zone, q) {
    let essais = 0;
    const fin = CONFIG.quiz.fuyant[CONFIG.quiz.fuyant.length - 1];
    const convertir = () => {
      b.dataset.converti = "1";
      b.classList.remove("libre", "fuyant");
      b.style.left = b.style.top = "";
      b.textContent = T(CONFIG.quiz.fuyantFinal) + " 💖";
      dire(fin, "content");
      Son.jouer("bien");
    };
    const fuir = e => {
      if (b.dataset.converti || this.repondu) return;
      essais++;
      if (essais >= 4) { convertir(); return; }
      b.classList.add("fuyant", "libre");
      const zr = zone.getBoundingClientRect();
      const bw = b.offsetWidth, bh = b.offsetHeight;
      // il s'enfuit dans l'espace libre sous les autres réponses, sans jamais les cacher
      const basAutres = Math.max(0, ...$$(".reponse", zone).filter(x => x !== b).map(x => x.getBoundingClientRect().bottom - zr.top));
      const yMin = basAutres + 10, yMax = Math.max(yMin, zr.height - bh);
      let x = 0, y = yMin;
      for (let t = 0; t < 25; t++) {
        x = Math.random() * Math.max(0, zr.width - bw);
        y = yMin + Math.random() * (yMax - yMin);
        if (Math.hypot(zr.left + x + bw / 2 - e.clientX, zr.top + y + bh / 2 - e.clientY) > 90) break;
      }
      b.style.left = x + "px"; b.style.top = y + "px";
      Son.jouer("oups");
      dire(CONFIG.quiz.fuyant[(essais - 1) % Math.max(1, CONFIG.quiz.fuyant.length - 1)], "chut");
    };
    b.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") fuir(e); });
    b.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") fuir(e); });
    b.addEventListener("click", e => {
      if (b.dataset.converti) { this.choisir({ ok: true, r: fin }, b, q, e); return; }
      if (e.detail === 0) convertir(); // au clavier, pas de course-poursuite : il cède directement
    });
  }
};

const Etape3 = {
  demarrer() {
    const grille = $("#memory"), cfg = CONFIG.memory;
    grille.innerHTML = "";
    this.retournees = []; this.paires = 0; this.coups = 0; this.verrou = false;
    melange(cfg.paires.flatMap((p, i) => [i, i])).forEach(i => {
      const p = cfg.paires[i];
      const b = creer("button", { class: "carte", type: "button", "aria-label": "Carte cachée" },
        `<span class="carte-int"><span class="face dos"><svg viewBox="0 0 40 40" style="color:#fffaf3"><use href="#loupe"/></svg></span><span class="face recto">${p.emoji}</span></span>`);
      if (p.photo) {
        const img = new Image();
        img.alt = "";
        img.onload = () => $(".face.recto", b).replaceChildren(img);
        img.src = p.photo;
      }
      b.dataset.paire = i;
      b.addEventListener("click", () => this.retourner(b));
      grille.append(b);
    });
    dire(cfg.intro);
    this.majCoups();
  },
  majCoups() { $("#memory-coups").textContent = `Essais : ${this.coups} · Paires : ${this.paires}/${CONFIG.memory.paires.length}`; },
  retourner(b) {
    if (this.verrou || b.classList.contains("retournee")) return;
    const cfg = CONFIG.memory, p = cfg.paires[b.dataset.paire];
    b.classList.add("retournee");
    b.setAttribute("aria-label", `Carte ${p.emoji}`);
    Son.jouer("carte");
    this.retournees.push(b);
    if (this.retournees.length < 2) return;
    this.coups++;
    const [a, c] = this.retournees;
    this.retournees = [];
    if (a.dataset.paire === c.dataset.paire) {
      this.paires++;
      this.majCoups();
      setTimeout(() => {
        a.classList.add("trouvee"); c.classList.add("trouvee");
        Son.jouer("bien");
        dire(p.legende, "content");
        const r = c.getBoundingClientRect();
        Particules.paillettes(r.left + r.width / 2, r.top + r.height / 2, 14);
      }, 420);
      if (this.paires === cfg.paires.length) setTimeout(() => etapeReussie(3), 2600);
    } else {
      this.majCoups();
      this.verrou = true;
      setTimeout(() => {
        a.classList.remove("retournee"); c.classList.remove("retournee");
        a.setAttribute("aria-label", "Carte cachée"); c.setAttribute("aria-label", "Carte cachée");
        if (this.coups % 2 === 1) dire(hasard(cfg.rate), "chut");
        this.verrou = false;
      }, 950);
    }
  }
};

// Si photos/puzzle.jpg existe, on la recadre en carré et on l'utilise à la place du dessin
function photoCarree(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const img = new Image();
    img.onload = () => {
      try {
        const cote = Math.min(img.naturalWidth, img.naturalHeight), t = Math.min(cote, 1200);
        const c = creer("canvas"); c.width = c.height = t;
        c.getContext("2d").drawImage(img, (img.naturalWidth - cote) / 2, (img.naturalHeight - cote) / 2, cote, cote, 0, 0, t, t);
        res(c.toDataURL("image/jpeg", .88));
      } catch (e) { res(src); }
    };
    img.onerror = () => res(null);
    img.src = src;
  });
}

const Etape4 = {
  ordre: [],
  demarrer() {
    const melangeOk = o => o.filter((v, i) => v === i).length <= 1;
    do { this.ordre = melange([0, 1, 2, 3, 4, 5, 6, 7, 8]); } while (!melangeOk(this.ordre));
    this.selection = null; this.fini = false;
    const zone = $("#puzzle");
    zone.classList.remove("resolu");
    zone.innerHTML = "";
    for (let pos = 0; pos < 9; pos++) {
      const b = creer("button", { class: "piece", type: "button" });
      b.dataset.pos = pos;
      b.style.backgroundImage = `url("${imagePuzzle}")`;
      this.brancher(b);
      zone.append(b);
    }
    this.dessiner();
    dire(CONFIG.puzzle.intro);
  },
  dessiner() {
    $$("#puzzle .piece").forEach((b, pos) => {
      const n = this.ordre[pos];
      b.style.backgroundPosition = `${(n % 3) * 50}% ${Math.floor(n / 3) * 50}%`;
      b.classList.toggle("ok", n === pos);
      b.setAttribute("aria-label", `Case ${pos + 1} : morceau ${n + 1}${n === pos ? ", bien placé" : ""}`);
    });
  },
  // Glisser-déposer au doigt ou à la souris + « touche, puis touche » + clavier
  brancher(b) {
    let depart = null, fantome = null, survol = null, aGlisse = false;
    b.addEventListener("pointerdown", e => {
      if (this.fini) return;
      depart = { x: e.clientX, y: e.clientY }; aGlisse = false;
      b.setPointerCapture(e.pointerId);
    });
    b.addEventListener("pointermove", e => {
      if (!depart || this.fini) return;
      if (!aGlisse && Math.hypot(e.clientX - depart.x, e.clientY - depart.y) > 8) {
        aGlisse = true;
        const r = b.getBoundingClientRect();
        fantome = creer("div", { class: "fantome" });
        fantome.style.cssText = `width:${r.width}px;height:${r.height}px;background-image:${b.style.backgroundImage};background-position:${b.style.backgroundPosition}`;
        document.body.append(fantome);
        b.classList.add("source");
        this.deselectionner();
      }
      if (aGlisse) {
        fantome.style.left = e.clientX - fantome.offsetWidth / 2 + "px";
        fantome.style.top = e.clientY - fantome.offsetHeight / 2 + "px";
        const sous = document.elementFromPoint(e.clientX, e.clientY);
        const cible = sous && sous.closest && sous.closest("#puzzle .piece");
        if (survol && survol !== cible) survol.classList.remove("cible-survol");
        survol = cible && cible !== b ? cible : null;
        if (survol) survol.classList.add("cible-survol");
      }
    });
    const finir = () => {
      if (aGlisse) {
        if (survol) { this.echanger(+b.dataset.pos, +survol.dataset.pos); survol.classList.remove("cible-survol"); }
        b.classList.remove("source");
        fantome && fantome.remove();
        b.dataset.ignorerClic = "1";
        setTimeout(() => delete b.dataset.ignorerClic, 50);
      }
      depart = null; fantome = null; survol = null; aGlisse = false;
    };
    b.addEventListener("pointerup", finir);
    b.addEventListener("pointercancel", finir);
    b.addEventListener("click", () => {
      if (b.dataset.ignorerClic || this.fini) return;
      const pos = +b.dataset.pos;
      if (this.selection === null) { this.selection = pos; b.classList.add("selection"); Son.jouer("tap"); }
      else if (this.selection === pos) this.deselectionner();
      else { const a = this.selection; this.deselectionner(); this.echanger(a, pos); }
    });
  },
  deselectionner() {
    $$("#puzzle .piece.selection").forEach(p => p.classList.remove("selection"));
    this.selection = null;
  },
  echanger(a, b) {
    if (a === b) return;
    [this.ordre[a], this.ordre[b]] = [this.ordre[b], this.ordre[a]];
    this.dessiner();
    const pieces = $$("#puzzle .piece");
    [pieces[a], pieces[b]].forEach(p => { p.classList.remove("echange"); void p.offsetWidth; p.classList.add("echange"); });
    Son.jouer("carte");
    if (this.ordre.every((v, i) => v === i)) return this.resoudre();
    if (this.ordre[a] === a || this.ordre[b] === b) { Son.jouer("bien"); dire(hasard(CONFIG.puzzle.bienPlace), "content"); }
  },
  resoudre() {
    this.fini = true;
    $("#puzzle").classList.add("resolu");
    Son.jouer("fanfare");
    dire("Recollée ! Regarde-moi ce décor…", "content");
    const r = $("#puzzle").getBoundingClientRect();
    Particules.coeurs(r.left + r.width / 2, r.top + r.height / 2, 18);
    setTimeout(() => etapeReussie(4), 1800);
  }
};

const Etape5 = {
  demarrer() {
    const cfg = CONFIG.code;
    const mot = CONFIG.ville.toUpperCase().normalize("NFD").replace(/[^A-Z]/g, "");
    const symb = { ...cfg.symboles };
    const reserve = ["⭐", "🎀", "🍀", "🍓", "🔔", "💎", "🎵", "🍒", "🌈", "🍩"];
    const pris = new Set([...Object.values(symb), ...Object.values(cfg.leurres)]);
    [...new Set(mot)].forEach(l => { if (!symb[l]) { const s = reserve.find(x => !pris.has(x)) || l; symb[l] = s; pris.add(s); } });
    const leurres = Object.entries(cfg.leurres).filter(([l]) => !mot.includes(l));
    this.mot = mot; this.symb = symb; this.pos = 0; this.erreurs = 0; this.fini = false;

    $("#message-code").classList.remove("resolu");
    $("#message-code").innerHTML = [...mot].map((l, i) =>
      `<div class="case-code" style="--i:${i}"><span class="symb" aria-hidden="true">${symb[l]}</span><span class="lettre" aria-label="Lettre ${i + 1}"></span></div>`).join("");
    const cles = melange([...[...new Set(mot)].map(l => [l, symb[l]]), ...leurres]);
    $("#grille-code").innerHTML = cles.map(([l, s]) => `<div class="cle" data-lettre="${l}"><span>${s}</span><span>=</span><span>${l}</span></div>`).join("");
    const touches = [...new Set([...mot, ...leurres.map(([l]) => l)])].sort();
    const clavier = $("#clavier");
    clavier.innerHTML = "";
    touches.forEach(l => {
      const b = creer("button", { class: "touche", type: "button" });
      b.textContent = l;
      b.addEventListener("click", e => this.taper(l, e));
      clavier.append(b);
    });
    $("#btn-indice-code").onclick = () => { if (!this.fini) { dire("Allez, je t'en donne une.", "chut"); this.taper(this.mot[this.pos]); } };
    this.activer();
    dire(cfg.intro);
  },
  activer() {
    $$("#message-code .case-code").forEach((c, i) => c.classList.toggle("active", i === this.pos));
  },
  taper(l, e) {
    if (this.fini) return;
    const cases = $$("#message-code .case-code"), c = cases[this.pos], attendu = this.mot[this.pos];
    if (l === attendu) {
      $(".lettre", c).textContent = l;
      c.classList.remove("active", "erreur"); c.classList.add("remplie");
      $$(".cle.eclaire").forEach(k => k.classList.remove("eclaire"));
      Son.jouer("bien");
      if (e && e.clientX) Particules.paillettes(e.clientX, e.clientY, 8);
      this.pos++; this.erreurs = 0;
      if (this.pos === this.mot.length) return this.resoudre();
      if (this.pos === Math.ceil(this.mot.length / 2)) dire("Ça commence à ressembler à quelque chose…", "content");
      this.activer();
    } else {
      c.classList.remove("erreur"); void c.offsetWidth; c.classList.add("erreur");
      Son.jouer("oups");
      this.erreurs++;
      dire(hasard(CONFIG.code.erreurs), "oups");
      if (this.erreurs >= 2) { const k = $(`.cle[data-lettre="${attendu}"]`); if (k) k.classList.add("eclaire"); }
    }
  },
  async resoudre() {
    this.fini = true;
    $("#message-code").classList.add("resolu");
    Son.jouer("fanfare");
    dire(`${CONFIG.code.resolu} !`, "content");
    await attendre(1300);
    const tampon = creer("div", { class: "tampon-final", "aria-hidden": "true" });
    tampon.textContent = T(CONFIG.code.resolu);
    document.body.append(tampon);
    Son.jouer("tampon");
    await attendre(1500);
    tampon.remove();
    etapeReussie(5);
  }
};

const ETAPES = { 1: Etape1, 2: Etape2, 3: Etape3, 4: Etape4, 5: Etape5 };
async function demarrerEtape(n) {
  await allerA("etape-" + n);
  majProgression(n);
  ETAPES[n].demarrer();
}
async function etapeReussie(n) {
  if (n === 1) Etape1.quitter();
  etapesFaites = Math.max(etapesFaites, n);
  majProgression(n);
  Son.jouer("sonnette");
  await attendre(600);
  if (n < 5) { await revelerIndice(n); demarrerEtape(n + 1); }
  else lancerFinal();
}
function ajouterIndiceSansFenetre(n) {
  const rev = CONFIG[CLES_ETAPES[n]].revelation;
  indicesTrouves.push({ n, titre: T(rev.titre), texte: T(rev.texte) });
}

/* ---------- Le briefing tapé à la machine ---------- */
async function briefing() {
  await allerA("ecran-briefing");
  const rapport = $("#rapport");
  rapport.innerHTML = "";
  let passer = false;
  const accelerer = () => { passer = true; };
  $("#ecran-briefing .feuille").addEventListener("click", accelerer);
  const curseur = creer("span", { class: "curseur" });
  for (const ligne of CONFIG.briefing.lignes) {
    const p = creer("p"), txt = T(ligne);
    rapport.append(p);
    if (passer || moinsDeMouvement) { p.textContent = txt; continue; }
    for (let i = 1; i <= txt.length; i++) {
      if (passer) break;
      p.textContent = txt.slice(0, i); p.append(curseur);
      if (i % 2) Son.jouer("touche");
      await new Promise(r => setTimeout(r, txt[i - 1] === " " ? 16 : 30));
    }
    p.textContent = txt;
    if (!passer) await new Promise(r => setTimeout(r, 380));
  }
  $("#ecran-briefing .feuille").removeEventListener("click", accelerer);
  $("#astuce-passer").hidden = true;
  const btn = $("#btn-mission");
  btn.hidden = false;
  btn.focus({ preventScroll: true });
}
