let minuterieCompte = null;
function majCompte() {
  const ms = dateDepart - Date.now(), el = $("#compte");
  if (ms <= 0) {
    el.innerHTML = `<div style="padding:12px 18px"><b style="font-size:1.3rem">${echapper(T(CONFIG.final.compteFini))}</b></div>`;
    clearInterval(minuterieCompte);
    return;
  }
  const vals = [Math.floor(ms / 864e5), Math.floor(ms / 36e5) % 24, Math.floor(ms / 6e4) % 60, Math.floor(ms / 1e3) % 60];
  el.innerHTML = vals.map((v, i) => `<div><b>${i ? String(v).padStart(2, "0") : v}</b><small>${echapper(CONFIG.final.unites[i])}</small></div>`).join("");
  el.setAttribute("aria-label", `${T(CONFIG.final.compteTitre)} ${vals[0]} ${CONFIG.final.unites[0]}`);
}

async function lancerFinal() {
  etapesFaites = 5;
  await allerA("ecran-final");
  majProgression(6);
  document.body.classList.add("fin");

  const titre = T(CONFIG.final.titre), h1 = $("#final-titre");
  h1.setAttribute("aria-label", titre);
  h1.innerHTML = `<span style="white-space:nowrap">${[...titre].map((ch, i) => ch === " " ? " " : `<span class="l" aria-hidden="true" style="--i:${i}">${echapper(ch)}</span>`).join("")}</span>`;

  const voyage = $("#voyage");
  voyage.className = "voyage " + (CONFIG.transport.mode === "avion" ? "avion" : "train");
  voyage.innerHTML = `<span class="nuage" style="left:8%;top:14px"></span><span class="nuage" style="left:62%;top:30px;transform:scale(.7)"></span><span class="nuage" style="left:84%;top:8px;transform:scale(.9)"></span>` + vehiculeSVG();

  majCompte();
  clearInterval(minuterieCompte);
  minuterieCompte = setInterval(majCompte, 1000);

  const jours = $("#jours");
  jours.innerHTML = "";
  CONFIG.jours.forEach((jr, i) => {
    const d = new Date(jourSeul(dateDepart)); d.setDate(d.getDate() + i);
    const b = creer("button", { class: "jour" + (jr.surprise ? " surprise" : ""), type: "button", "aria-pressed": "false" },
      `<span class="carte-int">
        <span class="face dos"><span class="emoji-jour" aria-hidden="true">${jr.surprise ? "🎁" : jr.emoji}</span><span class="num-jour">Jour ${i + 1} · ${fmtCourt.format(d)}</span><span class="titre-jour">${echapper(T(jr.surprise ? "Surprise !" : jr.titre))}</span></span>
        <span class="face recto"><span class="titre-recto">${jr.emoji} ${echapper(T(jr.titre))}</span><span class="liste-act">${jr.activites.map(a => `<span>${echapper(T(a))}</span>`).join("")}</span></span>
      </span>`);
    b.addEventListener("click", e => {
      const ouvert = b.classList.toggle("retournee");
      b.setAttribute("aria-pressed", ouvert);
      Son.jouer("carte");
      if (jr.surprise && ouvert && !b.dataset.vu) {
        b.dataset.vu = "1";
        Son.jouer("indice");
        Particules.coeurs(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, 18);
      }
    });
    jours.append(b);
  });

  const lettre = $("#lettre"), btnLettre = $("#btn-lettre");
  lettre.hidden = true; btnLettre.hidden = false; $(".rabat", btnLettre).style.transform = "";
  btnLettre.onclick = async e => {
    $(".rabat", btnLettre).style.transform = "scaleY(-1)";
    Son.jouer("indice");
    Particules.coeurs(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, 22);
    await attendre(450);
    btnLettre.hidden = true;
    lettre.innerHTML = CONFIG.final.lettre.map(p => `<p>${echapper(T(p))}</p>`).join("") + `<p class="signature">${echapper(T(CONFIG.final.signature))}</p>`;
    lettre.hidden = false;
    lettre.classList.remove("ouvre"); void lettre.offsetWidth; lettre.classList.add("ouvre");
    lettre.tabIndex = -1; lettre.focus({ preventScroll: true });
  };

  Son.jouer("fanfare");
  Particules.confettis(200);
  setTimeout(() => Particules.pluie(46), 1400);
}

/* ================================================================
   DÉMARRAGE
   ================================================================ */
function chargerPhoto(src, cible, alt) {
  if (!src) return;
  const img = new Image();
  img.alt = alt;
  img.onload = () => cible.replaceChildren(img);
  img.src = src;
}
function majBoutonSon() {
  const on = Son.actif;
  $("#icone-son").setAttribute("href", on ? "#i-son" : "#i-muet");
  $("#btn-son").setAttribute("aria-pressed", on);
  $("#lib-son").textContent = on ? "Couper le son" : "Activer le son";
}

function init() {
  document.title = T("Dossier confidentiel n°{numero}");
  $$("[data-t]").forEach(el => { el.textContent = T(lire(el.dataset.t)); });
  $(".chemise").dataset.onglet = "Confidentiel";
  $("#initiales").textContent = `${CONFIG.elle[0] || ""} + ${CONFIG.lui[0] || ""}`;
  $("#legende-nous").textContent = `${CONFIG.elle} & ${CONFIG.lui}`;
  const numero = String(CONFIG.reponse.whatsapp || "").replace(/\D/g, "");
  $("#btn-repondre").href = `https://wa.me/${numero}?text=${encodeURIComponent(T(CONFIG.reponse.message))}`;

  preparerAcolytes();
  preparerProgression();
  majBoutonSon();
  majCarnet(false);
  $("#btn-carnet").hidden = true;

  chargerPhoto(CONFIG.photos.suspects, $("#photo-suspects"), T("{elle} et {lui}"));
  chargerPhoto(CONFIG.photos.nous, $("#photo-nous"), T("{elle} et {lui}"));
  photoCarree(CONFIG.photos.puzzle).then(u => { if (u) imagePuzzle = u; });

  $("#btn-son").addEventListener("click", () => { Son.basculer(); majBoutonSon(); });
  $("#btn-carnet").addEventListener("click", () => { majCarnet(false); $("#carnet").showModal(); Son.jouer("tap"); });
  $("#btn-fermer-carnet").addEventListener("click", () => $("#carnet").close());
  $("#btn-continuer").addEventListener("click", () => $("#revelation").close());
  $("#btn-commencer").addEventListener("click", () => { Son.jouer("bien"); briefing(); });
  $("#btn-mission").addEventListener("click", () => { Son.jouer("tampon"); demarrerEtape(1); });
  $("#btn-confettis").addEventListener("click", () => { Son.jouer("fanfare"); Particules.confettis(160); });
  $("#btn-rejouer").addEventListener("click", () => { location.href = location.pathname; });

  // Petites étincelles à chaque bouton touché
  document.addEventListener("pointerdown", e => {
    if (e.target.closest && e.target.closest("button, a")) Particules.paillettes(e.clientX, e.clientY, 4);
  }, { passive: true });

  // Raccourcis pour TESTER : index.html?etape=3 ouvre directement l'étape 3, index.html?final ouvre la fin
  const params = new URLSearchParams(location.search);
  const etapeTest = parseInt(params.get("etape"), 10);
  if (params.has("final") || (etapeTest >= 1 && etapeTest <= 5)) {
    const n = params.has("final") ? 6 : etapeTest;
    for (let k = 1; k < Math.min(n, 5); k++) ajouterIndiceSansFenetre(k);
    etapesFaites = n - 1;
    majCarnet(false);
    if (n === 6) lancerFinal(); else demarrerEtape(n);
  }
}
init();
})();
</script>
